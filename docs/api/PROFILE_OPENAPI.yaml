          - type: 'null'
        headline: &id010
          oneOf:
          - *id007
          - type: 'null'
        bio: &id011
          oneOf:
          - *id007
          - type: 'null'
        location: &id012
          oneOf:
          - *id007
          - type: 'null'
        current_role: &id013
          oneOf:
          - *id007
          - type: 'null'
        preferred_role: &id014
          oneOf:
          - $ref: '#/components/schemas/PreferredRole'
          - type: 'null'
        available_hours_per_week: &id015
          oneOf:
          - type: integer
            minimum: 1
            maximum: 40
          - type: 'null'
        professional_interests: &id016
          oneOf:
          - *id007
          - type: 'null'
        learning_goals: &id017
          oneOf:
          - *id007
          - type: 'null'
        previous_projects_and_contribution: &id018
          oneOf:
          - *id007
          - type: 'null'
        technologies_to_learn: &id019
          oneOf:
          - *id007
          - type: 'null'
        github_url: &id020
          oneOf:
          - *id007
          - type: 'null'
        linkedin_url: &id021
          oneOf:
          - *id007
          - type: 'null'
        personal_website_url: &id022
          oneOf:
          - *id007
          - type: 'null'
        public_email: &id023
          oneOf:
          - *id007
          - type: 'null'
