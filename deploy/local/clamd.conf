# Cấu hình Development cho official clamav/clamav container.
# INSTREAM không có authentication: chỉ publish port trên loopback host.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no
ScanPDF yes
ScanArchive yes
StreamMaxLength 10000000
MaxFileSize 10000000
MaxScanSize 100M
MaxScanTime 25000
AlertEncrypted yes
AlertExceedsMax yes
HeuristicAlerts yes
